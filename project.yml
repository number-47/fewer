name: Fewer

options:
  bundleIdPrefix: com.number47
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    CLANG_ENABLE_MODULES: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  FewerCore:
    type: library.static
    platform: macOS
    sources:
      - FewerCore
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.number47.fewer.core
        PRODUCT_MODULE_NAME: FewerCore
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  FewerShortcutHelper:
    type: application
    platform: macOS
    sources:
      - FewerShortcutHelper
      - path: FewerApp/Assets.xcassets
    info:
      path: FewerShortcutHelper/Info.plist
      properties:
        LSUIElement: true
        CFBundleIconName: AppIcon
        FewerAppGroupIdentifier: $(FEWER_APP_GROUP_IDENTIFIER)
    entitlements:
      path: FewerShortcutHelper/FewerShortcutHelper.entitlements
      properties:
        com.apple.security.application-groups:
          - $(FEWER_APP_GROUP_IDENTIFIER)
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - target: FewerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.number47.fewer.shortcut-helper
        PRODUCT_NAME: FewerShortcutHelper
        INFOPLIST_KEY_LSUIElement: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES

  FewerFinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - FewerFinderExtension
      - path: Resources/Templates
        buildPhase: resources
    info:
      path: FewerFinderExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionAttributes: {}
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
        FewerAppGroupIdentifier: $(FEWER_APP_GROUP_IDENTIFIER)
    entitlements:
      path: FewerFinderExtension/FewerFinderExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(FEWER_APP_GROUP_IDENTIFIER)
        com.apple.security.temporary-exception.files.absolute-path.read-write:
          - "/"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - target: FewerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.number47.fewer.finder-extension
        PRODUCT_NAME: FewerFinderExtension
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  Fewer:
    type: application
    platform: macOS
    sources:
      - FewerApp
      - path: Resources
        buildPhase: resources
    info:
      path: FewerApp/Info.plist
      properties:
        LSUIElement: true
        NSCalendarsFullAccessUsageDescription: Fewer 需要读取系统日历，以在菜单栏日历中展示节假日订阅和日程。
        NSCalendarsUsageDescription: Fewer 需要读取系统日历，以在菜单栏日历中展示节假日订阅和日程。
        NSRemindersFullAccessUsageDescription: Fewer 需要读取提醒事项，以在菜单栏日历中展示带日期的计划任务。
        NSAppleEventsUsageDescription: Fewer 仅在你点击快捷操作时通过系统事件切换深色模式。
        NSLocationUsageDescription: Fewer 仅在你展开网络 Wi-Fi 详情时读取当前网络名称、BSSID 和信号强度。
        FewerAppGroupIdentifier: $(FEWER_APP_GROUP_IDENTIFIER)
    entitlements:
      path: FewerApp/Fewer.entitlements
      properties:
        com.apple.security.application-groups:
          - $(FEWER_APP_GROUP_IDENTIFIER)
        com.apple.security.personal-information.calendars: true
        com.apple.security.automation.apple-events: true
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - target: FewerCore
      - target: FewerFinderExtension
        embed: true
      - target: FewerShortcutHelper
        embed: false
      - sdk: CoreLocation.framework
      - sdk: CoreWLAN.framework
      - sdk: IOKit.framework
      - sdk: libIOReport.tbd
    postBuildScripts:
      - name: Embed Shortcut Helper
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          HELPER_SOURCE="${BUILT_PRODUCTS_DIR}/FewerShortcutHelper.app"
          HELPER_DIRECTORY="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Library/LoginItems"
          /bin/mkdir -p "${HELPER_DIRECTORY}"
          /usr/bin/ditto "${HELPER_SOURCE}" "${HELPER_DIRECTORY}/FewerShortcutHelper.app"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.number47.fewer
        PRODUCT_NAME: Fewer
        INFOPLIST_KEY_LSUIElement: YES
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_OBJC_BRIDGING_HEADER: FewerApp/Support/SystemMetricsBridge.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  FewerCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - FewerCoreTests
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - target: FewerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.number47.fewer.core-tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

  FewerUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - FewerUITests
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - target: Fewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.number47.fewer.ui-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Fewer

schemes:
  Fewer:
    build:
      targets:
        Fewer: all
        FewerCoreTests: [test]
        FewerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FewerCoreTests
        - FewerUITests
  FewerCore:
    build:
      targets:
        FewerCore: all
        FewerCoreTests: [test]
    test:
      config: Debug
      targets:
        - FewerCoreTests
